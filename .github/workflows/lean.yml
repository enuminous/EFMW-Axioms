name: Lean

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false

      - name: Resolve dependencies
        run: lake update

      - name: Build formalization
        run: lake build

      - name: Reject proof placeholders
        run: |
          if grep -RInE '\b(sorry|admit)\b' EFMWAxioms; then
            echo "Found proof placeholder"
            exit 1
          fi
